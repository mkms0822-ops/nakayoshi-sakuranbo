<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nakayoshi｜みんなで遊びましょー</title>
<meta name="description" content="全力で思いっきり遊ぼうね。みんなで遊びましょー nakayoshi。since 2026">
<meta property="og:type" content="website">
<meta property="og:title" content="nakayoshi｜みんなで遊びましょー">
<meta property="og:description" content="Let's have a blast together! 全力で思いっきり遊ぼうね">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="nk-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="nakayoshi">
<meta name="theme-color" content="#cfe0f5">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:#dce9f7;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    color:#2d3a4a;
    -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }

  .wrap{
    max-width:760px;margin:0 auto;
    padding:16px 12px calc(28px + env(safe-area-inset-bottom,0px));
    padding-top:calc(16px + env(safe-area-inset-top,0px));
  }

  /* ====== トップ画像をライズアップ ====== */
  .top{
    position:relative;
    opacity:0;
    transform:translateY(54px) scale(.97);
    filter:blur(8px);
    transition:opacity 1.1s cubic-bezier(.16,1,.3,1),
               transform 1.1s cubic-bezier(.16,1,.3,1),
               filter 1.1s cubic-bezier(.16,1,.3,1);
    will-change:opacity,transform,filter;
  }
  .top.up{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}

  .top-in{
    position:relative;
    border-radius:16px;overflow:hidden;
    box-shadow:0 12px 36px rgba(60,90,130,.22);
    background:#dce9f7;
  }
  .top-in img{width:100%;height:auto;display:block}

  /* ====== 画像の上に重ねる、見えないボタン ====== */
  .hot{
    position:absolute;
    border:none;background:transparent;padding:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    text-indent:-9999px;overflow:hidden;
    display:block;z-index:3;
  }
  .hot:focus-visible{outline:3px solid #e03a3a;outline-offset:4px;border-radius:50%}
  .hot:active{transform:scale(.96)}

  /* さくらんぼ（画像から実測した位置） */
  .hot.play{left:29.84%;top:59.15%;width:17.82%;height:11.85%;border-radius:50%}
  .hot.arch{left:48.66%;top:59.30%;width:17.54%;height:11.70%;border-radius:50%}
  /* 問い合わせ・プライバシーポリシーの行 */
  .hot.info{left:27.50%;top:84.30%;width:45.00%;height:2.60%;border-radius:8px}

  /* ====== さくらんぼの緩やかなパルス ====== */
  .pulse{
    position:absolute;pointer-events:none;z-index:2;
    border-radius:50%;
    box-shadow:0 0 0 0 rgba(224,58,58,0);
  }
  .pulse.play{left:29.84%;top:59.15%;width:17.82%;height:11.85%}
  .pulse.arch{left:48.66%;top:59.30%;width:17.54%;height:11.70%}
  .top.up .pulse{animation:cherryPulse 3.2s ease-in-out infinite}
  .top.up .pulse.arch{animation-delay:1.6s}
  @keyframes cherryPulse{
    0%   {box-shadow:0 0 0 0    rgba(224,58,58,.38); transform:scale(1)}
    60%  {box-shadow:0 0 0 18px rgba(224,58,58,0);   transform:scale(1.03)}
    100% {box-shadow:0 0 0 0    rgba(224,58,58,0);   transform:scale(1)}
  }

  /* ====== 画像の下のボタン ====== */
  .btns{display:grid;gap:10px;margin:16px 0 0;max-width:340px;margin-left:auto;margin-right:auto}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:7px;
    padding:16px 10px;border:none;border-radius:99px;
    background:#e03a3a;color:#fff;
    font-family:inherit;font-size:15.5px;font-weight:700;
    text-decoration:none;cursor:pointer;
    box-shadow:0 5px 16px rgba(224,58,58,.3);
    transition:filter .15s,transform .15s;
  }
    .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:3px solid #2d3a4a;outline-offset:3px}

  /* ====== ダイアログ ====== */
  .modal{
    position:fixed;inset:0;z-index:1000;display:none;
    background:rgba(40,60,85,.55);
    padding:18px;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .modal.open{display:block}
  .modal-in{
    max-width:580px;margin:34px auto;
    background:#fff;border-radius:18px;
    padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));
    box-shadow:0 18px 50px rgba(30,50,75,.35);
    position:relative;
  }
  .modal-x{
    position:absolute;top:13px;right:15px;
    background:none;border:none;font-size:22px;color:#8c9bb0;
    cursor:pointer;line-height:1;padding:4px;
  }
  .modal-x:hover{color:#2d3a4a}
  .modal h2{
    font-size:19px;font-weight:700;margin-bottom:6px;
    display:flex;align-items:center;gap:8px;color:#2d3a4a;
  }
  .modal .lead{font-size:12.5px;color:#7b8a9e;line-height:1.8;margin-bottom:18px}
  .modal h3{font-size:14.5px;font-weight:700;color:#c0392b;margin:20px 0 7px}
  .modal p{font-size:14px;line-height:1.95;margin-bottom:10px}
  .modal ul{margin:0 0 10px 20px}
  .modal li{font-size:13.5px;line-height:1.9;margin-bottom:5px}
  .modal .note{font-size:12.5px;color:#7b8a9e;line-height:1.85}

  /* 連絡先 */
  .ct{display:grid;gap:10px;margin:4px 0 6px}
  .ct a{
    display:flex;align-items:center;gap:13px;
    padding:16px 18px;border-radius:14px;
    background:#fdf2f2;border:2px solid #f3c6c6;
    text-decoration:none;color:#2d3a4a;
    transition:border-color .15s,transform .15s;
  }
  .ct a:hover{border-color:#e03a3a;transform:translateX(3px)}
  .ct a:focus-visible{outline:3px solid #e03a3a;outline-offset:2px}
  .ct .ic{font-size:24px;flex-shrink:0}
  .ct .tx{flex:1;min-width:0}
  .ct .tx b{display:block;font-size:17px;font-weight:700;letter-spacing:.02em;word-break:break-all}
  .ct .tx small{display:block;font-size:11.5px;color:#8c7070;margin-top:3px}
  .ct .go{font-size:13px;color:#cc9999;flex-shrink:0}
  .ct-name{
    text-align:center;font-size:13.5px;color:#5a6a7e;
    padding:12px 0 2px;line-height:1.8;
  }
  .ct-name b{font-size:16px;color:#2d3a4a}

  /* アーカイブの空表示 */
  .empty{text-align:center;padding:34px 16px 20px}
  .empty .em{font-size:46px;display:block;margin-bottom:12px}
  .empty p{font-size:15px;line-height:2;color:#5a6a7e}
  .empty .sm{font-size:12.5px;color:#8c9bb0;margin-top:10px}

  .tbl{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:13px}
  .tbl th,.tbl td{border:1px solid #dbe5f0;padding:9px 11px;text-align:left;line-height:1.75}
  .tbl th{background:#f2f7fc;width:36%;font-weight:700;color:#4a5a6e}

  .foot{
    text-align:center;font-size:11.5px;color:#7b8a9e;
    padding:22px 10px 4px;line-height:1.9;
  }

  @media (max-width:430px){
    .btn{font-size:15px}
    .modal-in{padding:20px 16px;margin:18px auto}
    .ct .tx b{font-size:15.5px}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .top{opacity:1;transform:none;filter:none;transition:none}
    .top.up .pulse{animation:none}
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="top" id="top">
    <div class="top-in">
      <img src="nakayoshi-top.jpg"
           alt="nakayoshi since 2026。Let's have a blast together! 全力で思いっきり遊ぼうね。さくらんぼのボタンが2つ（Let's play と Archive）。">
      <span class="pulse play" aria-hidden="true"></span>
      <span class="pulse arch" aria-hidden="true"></span>
      <a class="hot play" href="nakayoshi.html" aria-label="Let's play ― 遊びに行こう">Let's play</a>
      <button type="button" class="hot arch" onclick="openM('mArch')"
              aria-label="Archive ― これまでの記録">Archive</button>
      <button type="button" class="hot info" onclick="openM('mInfo')"
              aria-label="お問い合わせ・プライバシーポリシー">お問い合わせ・プライバシーポリシー</button>
    </div>
  </div>

  <div class="btns">
    <a class="btn" href="nakayoshi.html">🍒 Let’s play</a>
  </div>

  <div class="foot">
    &copy; 2026 Koji Furutani. All Rights Reserved.
  </div>

</div>






<script>
/* ============================================================
   トップ画像のライズアップ
   ============================================================ */
(function(){
  var el = document.getElementById('top');
  if(!el) return;
  var img = el.querySelector('img');
  var done = false;

  function play(){
    if(done) return;
    done = true;
    el.classList.add('up');
  }

  function watch(){
    if(!('IntersectionObserver' in window)){ play(); return; }
    var io = new IntersectionObserver(function(es){
      for(var i=0;i<es.length;i++){
        if(es[i].isIntersecting){ play(); io.disconnect(); break; }
      }
    }, { threshold: 0.1 });
    io.observe(el);
    /* 最初から見えていれば待たずに出す */
    setTimeout(function(){
      var r = el.getBoundingClientRect();
      if(r.top < window.innerHeight && r.bottom > 0) play();
    }, 60);
  }

  function ready(){
    if(img && !img.complete){
      img.addEventListener('load', watch, { once:true });
      img.addEventListener('error', play, { once:true });
      setTimeout(play, 2600);   /* 読み込みが長引いても隠したままにしない */
    }else{
      watch();
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', ready);
  }else{
    ready();
  }
})();

</script>

<script src="menu.js" defer></script>
</body>
</html>
