<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nakayoshi｜みんなで遊びましょーの会（京都市立丹波自然運動公園 編）</title>
<meta name="description" content="2026年10月18日（日）京都府立丹波自然運動公園で開催。子供たちと遊んで遊んで遊びまくる一日。園内マップと利用Q&Aもご確認ください。">
<meta property="og:type" content="website">
<meta property="og:title" content="nakayoshi｜みんなで遊びましょーの会">
<meta property="og:description" content="2026年10月18日（日）丹波自然運動公園 編">
<meta name="theme-color" content="#b8e04a">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:76px}

  /* ====== 緊急用ヘッダー ====== */
  .ehead{
    position:sticky;top:0;z-index:900;
    background:#2b3a1c;
    padding:9px 12px;
    padding-top:calc(9px + env(safe-area-inset-top,0px));
    box-shadow:0 2px 12px rgba(40,60,20,.3);
  }
  .ehead-in{
    max-width:820px;margin:0 auto;
    display:flex;align-items:center;gap:10px;
  }
  .ehead .lb{
    font-size:11.5px;color:#c8d9b0;line-height:1.4;
    display:flex;flex-direction:column;flex-shrink:0;
  }
  .ehead .lb b{font-size:13px;color:#fff;font-weight:700}
  .enear{
    margin-left:auto;
    display:inline-flex;align-items:center;gap:7px;
    background:#d93025;color:#fff;
    border-radius:99px;padding:10px 18px;
    font-size:14px;font-weight:700;text-decoration:none;
    box-shadow:0 3px 12px rgba(217,48,37,.42);
    white-space:nowrap;
    transition:filter .15s,transform .15s;
  }
  .enear:hover{filter:brightness(1.1)}
  .enear:active{transform:translateY(1px)}
  .enear:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .enear .ic{font-size:16px}
  /* そこにあることに気づいてもらう */
  @keyframes eglow{
    0%,100%{box-shadow:0 3px 12px rgba(217,48,37,.42)}
    50%{box-shadow:0 3px 12px rgba(217,48,37,.42),0 0 0 6px rgba(217,48,37,.22)}
  }
  .enear{animation:eglow 3.2s ease-in-out 1.5s 3}
  .enear:hover{animation:none}

  @media (max-width:430px){
    .ehead{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
    .ehead .lb{font-size:10.5px}
    .ehead .lb b{font-size:12px}
    .enear{padding:9px 14px;font-size:13px}
  }
  body{
    background:#eef3e6;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    color:#2b3a1c;
    -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }

  .wrap{max-width:820px;margin:0 auto;padding:18px 14px 60px}

  /* ====== 1枚ずつライズアップ ====== */
  .sheet{
    position:relative;
    margin:0 0 20px;
    opacity:0;
    transform:translateY(60px) scale(.97);
    transition:opacity .95s cubic-bezier(.16,1,.3,1),
               transform .95s cubic-bezier(.16,1,.3,1);
    will-change:opacity,transform;
  }
  .sheet.up{opacity:1;transform:translateY(0) scale(1)}

  .sheet-in{
    position:relative;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 10px 34px rgba(40,60,20,.18);
    background:#fff;
  }
  .sheet-in img{
    width:100%;height:auto;display:block;
  }

  /* ====== 画像の上に重ねる、見えないボタン ====== */
  .hot{
    position:absolute;
    border:none;background:transparent;
    cursor:pointer;
    border-radius:14%/28%;
    -webkit-tap-highlight-color:transparent;
    display:block;padding:0;
    text-indent:-9999px;overflow:hidden;
    transition:box-shadow .18s, transform .18s;
  }
  .hot:hover,.hot:focus-visible{
    box-shadow:0 0 0 4px rgba(255,255,255,.95),
               0 0 0 8px rgba(227,110,30,.55);
    transform:scale(1.03);
    outline:none;
  }
  .hot:active{transform:scale(.97)}
  /* 位置は画像から実測した値 */
  .hot.park{left:74.68%;top:36.65%;width:21.50%;height:8.30%}
  .hot.kiri{left:76.52%;top:50.90%;width:17.82%;height:6.30%}

  /* 押せることが分かるよう、最初だけそっと光る */
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
    50%{box-shadow:0 0 0 5px rgba(255,255,255,.85),0 0 0 9px rgba(227,110,30,.45)}
  }
  .sheet.up .hot{animation:pulse 2.4s ease-in-out 1.2s 3}
  .hot:hover{animation:none !important}

  /* ====== 画像の下に出すボタン（画像内が押しにくい端末向け） ====== */
  .btns{
    display:grid;gap:10px;margin:-6px 0 22px;
  }
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:16px 18px;
    background:#f07d1a;color:#fff;
    border:none;border-radius:99px;
    font-family:inherit;font-size:16px;font-weight:700;
    text-decoration:none;cursor:pointer;
    box-shadow:0 5px 16px rgba(240,125,26,.32);
    transition:filter .15s,transform .15s;
  }
  .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:3px solid #2b3a1c;outline-offset:3px}
  .btn .arw{font-size:13px;transition:transform .22s}
  .btn.open .arw{transform:rotate(180deg)}

  /* ====== アコーディオン ====== */
  .acc{
    max-height:0;overflow:hidden;
    transition:max-height .42s cubic-bezier(.4,0,.2,1);
  }
  .acc.open{max-height:420px}
  .acc-in{
    display:grid;gap:8px;
    padding:12px 10px 4px;
  }
  .sub{
    display:flex;align-items:center;gap:11px;
    padding:14px 16px;
    background:#fff;border:2px solid #f6c38a;
    border-radius:14px;color:#8a4a08;
    text-decoration:none;font-size:14.5px;font-weight:700;
    line-height:1.5;
    transition:border-color .15s,transform .15s;
  }
  .sub:hover{border-color:#f07d1a;transform:translateX(3px)}
  .sub:focus-visible{outline:3px solid #f07d1a;outline-offset:2px}
  .sub .ic{font-size:19px;flex-shrink:0}
  .sub .tx{flex:1;min-width:0}
  .sub .tx small{display:block;font-size:11.5px;font-weight:400;color:#a9793f;margin-top:2px}
  .sub .go{font-size:12px;color:#c08b4a;flex-shrink:0}

  /* ====== 下部 ====== */
  .foot{
    text-align:center;padding:26px 14px 10px;
    font-size:12.5px;color:#6a7a58;line-height:1.9;
  }
  .totop{
    display:inline-block;margin-top:14px;
    padding:11px 22px;border-radius:99px;
    background:#fff;border:2px solid #cfdcbb;color:#4a5c36;
    text-decoration:none;font-size:13.5px;font-weight:700;
  }
  .totop:hover{border-color:#9bb97a}

  @media (max-width:520px){
    .wrap{padding:12px 10px 50px}
    .btn{font-size:15px;padding:15px 16px}
    .sub{font-size:13.5px;padding:13px 14px}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .sheet{opacity:1;transform:none;transition:none}
    .enear{animation:none}
    .sheet.up .hot{animation:none}
    .acc{transition:none}
  }
</style>
</head>
<body>

<header class="ehead">
  <div class="ehead-in">
    <span class="lb"><b>緊急時はこちら</b>避難所・病院・AEDを探す</span>
    <a class="enear" href="https://bousai0111.info/#near" target="_blank" rel="noopener">
      <span class="ic">🆘</span>近くを探す
    </a>
  </div>
</header>

<div class="wrap">

  <!-- 1枚目：告知 -->
  <div class="sheet" id="sh1">
    <div class="sheet-in">
      <img src="nakayoshi-1.jpg"
           alt="nakayoshi 京都市立丹波自然運動公園 編。決行日 2026年10月18日（日）。集合9時〜10時、解散16時〜17時。小雨は決行、雨量が多い予報なら亀岡サンガスタジアム室内遊戯施設へ変更。持ち物は飲み物・昼食・お菓子・レジャーシート・絆創膏・雨具など。">
      <button type="button" class="hot park" onclick="togglePark()"
              aria-label="丹波自然運動公園のサイトを開く">丹波自然運動公園サイト</button>
      <a class="hot kiri" href="https://kirinoko.com/" target="_blank" rel="noopener"
         aria-label="KIRInoko のサイトを開く">KIRInoko サイト</a>
    </div>
  </div>

  <!-- ボタン -->
  <div class="btns">
    <a class="btn" href="https://kirinoko.com/" target="_blank" rel="noopener">
      🪵 KIRInoko のサイトへ <span class="arw">↗</span>
    </a>

    <div>
      <button type="button" class="btn" id="parkBtn" onclick="togglePark()"
              aria-expanded="false" aria-controls="parkAcc">
        🌳 丹波自然運動公園のページ <span class="arw">▾</span>
      </button>
      <div class="acc" id="parkAcc">
        <div class="acc-in">
          <a class="sub" href="https://www.kyoto-tanbapark.or.jp/" target="_blank" rel="noopener">
            <span class="ic">🏞</span>
            <span class="tx">公園のメインサイト<small>開園時間・アクセス・お知らせ</small></span>
            <span class="go">↗</span>
          </a>
          <a class="sub" href="https://www.kyoto-tanbapark.or.jp/play/page01.html" target="_blank" rel="noopener">
            <span class="ic">🧗</span>
            <span class="tx">わくわくアスレチックパーク・こどもの広場<small>遊具の紹介ページ</small></span>
            <span class="go">↗</span>
          </a>
          <a class="sub" href="https://www.kyoto-tanbapark.or.jp/play/img/p01/top-w-org.jpg" target="_blank" rel="noopener">
            <span class="ic">🔍</span>
            <span class="tx">アスレチックパーク マップ拡大図<small>画像が開きます</small></span>
            <span class="go">↗</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- 2枚目：園内マップ -->
  <div class="sheet" id="sh2">
    <div class="sheet-in">
      <img src="nakayoshi-2.jpg" loading="lazy"
           alt="園内マップ。正門・南門・北門、無料駐車場、トイレ、AED設置施設の位置。わくわくアスレチックパーク、こどもの広場、ジャイアントスライダー、ジャブジャブ池、体育館、陸上競技場などの配置図。">
    </div>
  </div>

  <!-- 3枚目：園内利用Q&A -->
  <div class="sheet" id="sh3">
    <div class="sheet-in">
      <img src="nakayoshi-3.jpg" loading="lazy"
           alt="園内利用Q&A。テントは1.8m×1.8m×高さ1.5m程度の日避け用なら設置可能。お弁当の持ち込みは可、ゴミは持ち帰り。こどもの広場とアスレチックは徒歩約10分。開園時間は4月〜9月が8時〜18時、10月〜3月が9時〜17時。休園日は12月29日〜1月3日。">
    </div>
  </div>

  <div class="foot">
    内容は変更になる場合があります。<br>
    公園の最新情報は公式サイトでご確認ください。
    <br>
    <a class="totop" href="#sh1">↑ はじめにもどる</a>
  </div>

</div>

<script>
/* ============================================================
   1枚ずつ、画面に入ったら下から立ち上げる
   ============================================================ */
(function(){
  var sheets = document.querySelectorAll('.sheet');
  if(!sheets.length) return;

  function show(el){ el.classList.add('up'); }

  if(!('IntersectionObserver' in window)){
    for(var i=0;i<sheets.length;i++) show(sheets[i]);
    return;
  }

  var io = new IntersectionObserver(function(es){
    for(var i=0;i<es.length;i++){
      if(!es[i].isIntersecting) continue;
      show(es[i].target);
      io.unobserve(es[i].target);
    }
  }, { threshold: 0.08, rootMargin: '0px 0px -5% 0px' });

  for(var j=0;j<sheets.length;j++) io.observe(sheets[j]);

  /* 最初から見えているものは、待たずに出す */
  setTimeout(function(){
    for(var k=0;k<sheets.length;k++){
      var r = sheets[k].getBoundingClientRect();
      if(r.top < window.innerHeight * 0.95 && r.bottom > 0){
        show(sheets[k]);
        io.unobserve(sheets[k]);
      }
    }
  }, 60);

  /* 何かの理由で出ないまま残らないようにする */
  setTimeout(function(){
    for(var m=0;m<sheets.length;m++) show(sheets[m]);
  }, 6000);
})();

/* ============================================================
   丹波自然運動公園のアコーディオン
   ============================================================ */
function togglePark(){
  var acc = document.getElementById('parkAcc');
  var btn = document.getElementById('parkBtn');
  var open = !acc.classList.contains('open');
  acc.classList.toggle('open', open);
  btn.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if(open){
    setTimeout(function(){
      btn.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }, 120);
  }
}
</script>

</body>
</html>
